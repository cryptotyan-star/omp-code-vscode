name: Release

# Publishing is a tag push: `git tag v1.2.3 && git push origin v1.2.3`.
# The job rebuilds from the tagged tree rather than uploading a locally built
# artifact, so what people download is what the tag actually contains.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/pack-dist.sh runs `git archive HEAD`, which needs the
          # commit object rather than just a worktree.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as CI: a tag must not ship code that fails the suite.
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ($manifest)" >&2
            exit 1
          fi

      - run: npm run dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            omp-code-*.vsix
            omp-code-*-src+vsix.zip
