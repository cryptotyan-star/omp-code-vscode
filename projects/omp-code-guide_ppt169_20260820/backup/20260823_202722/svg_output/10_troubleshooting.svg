  <g id="commands-note" data-pptx-bounds="744 370 472 60">
    <use data-icon="tabler-outline/keyboard" x="744" y="376" width="20" height="20" fill="#6B667E" stroke-width="2"/>
    <text x="776" y="392" font-size="15" fill="#6B667E"><tspan x="776" dy="0">Все шестнадцать команд — в палитре</tspan><tspan x="776" dy="22">под префиксом OMP Code:</tspan></text>
  </g>

  <g id="platforms" data-pptx-bounds="744 432 472 148">
    <line x1="744" y1="436" x2="1216" y2="436" stroke="#DDD8EE" stroke-width="1"/>
    <text x="744" y="474" font-size="20" font-weight="bold" fill="#2A2440">Платформы</text>
    <text x="744" y="502" font-size="15" fill="#1D1B26"><tspan x="744" dy="0">Чистый JavaScript: .vsix ставится на macOS,</tspan><tspan x="744" dy="22">Linux и Windows. Нативная часть только у omp:</tspan><tspan x="744" dy="22">darwin-arm64/x64, linux-x64/arm64, win32-x64.</tspan><tspan x="744" dy="22">Windows на ARM не поддерживается.</tspan></text>
  </g>

  <g id="language-note" data-pptx-bounds="744 588 472 60">
    <text x="744" y="606" font-size="15" fill="#6B667E"><tspan x="744" dy="0">ompcode.language не зависит от языка</tspan><tspan x="744" dy="22">интерфейса VS Code — Language Pack не нужен.</tspan></text>
