    <text x="124" y="211" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A2440">OMP Code: Run Diagnostics</text>
  </g>

  <g id="diagnostics-report" data-pptx-bounds="64 238 636 72">
    <text x="64" y="254" font-size="15" fill="#6B667E"><tspan x="64" dy="0">Отчёт показывает путь к бинарнику, вывод omp --version, проходит ли</tspan><tspan x="64" dy="22">хендшейк, у каких провайдеров есть учётные данные, какие модели</tspan><tspan x="64" dy="22">предлагает агент. Значений ключей в нём нет — можно приложить к issue.</tspan></text>
  </g>

  <g id="symptom-binary" data-pptx-bounds="64 322 636 104">
    <line x1="64" y1="326" x2="700" y2="326" stroke="#DDD8EE" stroke-width="1"/>
    <text x="64" y="364" font-size="20" font-weight="bold" fill="#2A2440">Cannot find the omp binary</text>
    <text x="64" y="390" font-size="15" fill="#1D1B26"><tspan x="64" dy="0">CLI не установлен или не в том PATH, который видит VS Code.</tspan><tspan x="64" dy="22">Укажите полный путь в ompcode.ompPath.</tspan></text>
  </g>

  <g id="symptom-401" data-pptx-bounds="64 434 636 96">
    <line x1="64" y1="438" x2="700" y2="438" stroke="#DDD8EE" stroke-width="1"/>
    <text x="64" y="472" font-size="20" font-weight="bold" fill="#2A2440">Везде 401</text>
    <text x="64" y="498" font-size="15" fill="#1D1B26"><tspan x="64" dy="0">Протухший ключ. Удалите его командой OMP Code: Clear Stored</tspan><tspan x="64" dy="22">API Key — входы по подписке это не затронет.</tspan></text>
  </g>

  <g id="symptom-short-list" data-pptx-bounds="64 538 636 96">
    <line x1="64" y1="542" x2="700" y2="542" stroke="#DDD8EE" stroke-width="1"/>
    <text x="64" y="576" font-size="20" font-weight="bold" fill="#2A2440">Список моделей короткий</text>
    <text x="64" y="602" font-size="15" fill="#1D1B26"><tspan x="64" dy="0">Проверка скрыла нерабочие. Пункт Show all models в выборе</tspan><tspan x="64" dy="22">модели их покажет, Re-check subscriptions перезапустит проверку.</tspan></text>
  </g>

