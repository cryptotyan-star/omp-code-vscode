<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="ending" font-family="Golos Text, Arial, Helvetica Neue, sans-serif">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="64 56 1152 100">
    <text x="64" y="76" font-size="15" font-weight="bold" letter-spacing="2" fill="#6F5CE8">СПРАВОЧНИК · ДИАГНОСТИКА</text>
    <text x="64" y="124" font-size="38" font-weight="bold" fill="#2A2440">Если что-то не работает</text>
    <line x1="64" y1="150" x2="1216" y2="150" stroke="#DDD8EE" stroke-width="1"/>
  </g>

  <g id="diagnostics-command" data-pptx-bounds="64 176 636 56">
    <rect x="64" y="180" width="636" height="48" fill="#F4F3FA"/>
    <rect x="64" y="180" width="3" height="48" fill="#6F5CE8"/>
