    <text x="128" y="472" font-size="20" font-weight="bold" fill="#2A2440">Оговорка про task</text>
    <text x="88" y="514" font-size="15" fill="#1D1B26"><tspan x="88" dy="0">Подтверждение одного вызова task отдаёт субагенту тот же уровень:</tspan><tspan x="88" dy="22">одобренная задача может запускать команды без повторного спроса.</tspan><tspan x="88" dy="22">Правила под конкретный инструмент — tools.approval в оверлее профиля —</tspan><tspan x="88" dy="22">соблюдаются даже под yolo. Это надёжный способ закрыть один</tspan><tspan x="88" dy="22">инструмент наглухо.</tspan></text>
  </g>

