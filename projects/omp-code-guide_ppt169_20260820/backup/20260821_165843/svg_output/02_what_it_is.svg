<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Arial, Helvetica Neue, sans-serif">
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6F5CE8"/>
    </marker>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="64 56 1152 100">
    <text x="64" y="76" font-size="15" font-weight="bold" letter-spacing="2" fill="#6F5CE8">ЧТО ЭТО ТАКОЕ</text>
    <text x="64" y="124" font-size="38" font-weight="bold" fill="#2A2440">Расширение — это GUI. Работу делает CLI-агент</text>
    <line x1="64" y1="150" x2="1216" y2="150" stroke="#DDD8EE" stroke-width="1"/>
  </g>

  <g id="part-extension" data-pptx-bounds="64 188 524 212">
    <text x="64" y="214" font-size="26" font-weight="bold" fill="#2A2440">Расширение OMP Code</text>
    <text x="64" y="248" font-size="15" fill="#6B667E">Панель чата внутри VS Code</text>
    <rect x="64" y="299" width="12" height="2" fill="#6F5CE8"/>
    <text x="88" y="306" font-size="20" fill="#1D1B26">Рисует диалог и карточки инструментов</text>
    <rect x="64" y="341" width="12" height="2" fill="#6F5CE8"/>
    <text x="88" y="348" font-size="20" fill="#1D1B26">Показывает diff и стоимость сессии</text>
    <rect x="64" y="383" width="12" height="2" fill="#6F5CE8"/>
    <text x="88" y="390" font-size="20" fill="#1D1B26">Ни сервера, ни телеметрии, ни аккаунта</text>
  </g>

  <g id="part-link" data-pptx-bounds="596 268 88 60">
    <text x="640" y="290" font-size="15" font-weight="bold" fill="#6F5CE8" text-anchor="middle">RPC</text>
    <line x1="600" y1="312" x2="672" y2="312" stroke="#6F5CE8" stroke-width="2" marker-end="url(#arrow-accent)"/>
  </g>

  <g id="part-agent" data-pptx-bounds="692 188 524 212">
    <text x="692" y="214" font-size="26" font-weight="bold" fill="#2A2440">CLI-агент omp</text>
    <text x="692" y="248" font-size="15" fill="#6B667E">Пакет @oh-my-pi/pi-coding-agent</text>
    <rect x="692" y="299" width="12" height="2" fill="#6F5CE8"/>
    <text x="716" y="306" font-size="20" fill="#1D1B26">Вызывает модели и выполняет инструменты</text>
    <rect x="692" y="341" width="12" height="2" fill="#6F5CE8"/>
    <text x="716" y="348" font-size="20" fill="#1D1B26">Хранит сессии и учётные данные подписок</text>
    <rect x="692" y="383" width="12" height="2" fill="#6F5CE8"/>
    <text x="716" y="390" font-size="20" fill="#1D1B26">Ставится отдельно — первым шагом</text>
  </g>

  <g id="dependency-warning" data-pptx-bounds="64 448 1152 104">
    <rect x="64" y="452" width="1152" height="96" fill="#F4F3FA"/>
    <rect x="64" y="452" width="3" height="96" fill="#6F5CE8"/>
    <use data-icon="tabler-outline/alert-triangle" x="92" y="478" width="26" height="26" fill="#6F5CE8" stroke-width="2"/>
    <text x="136" y="490" font-size="20" fill="#1D1B26"><tspan x="136" dy="0">Без установленного бинарника omp панель не стартует — это не опциональная зависимость.</tspan><tspan x="136" dy="30">Ключи и код уходят ровно туда, куда их отправляет omp, и никуда больше.</tspan></text>
  </g>

  <g id="affiliation-note" data-pptx-bounds="64 596 1152 28">
    <text x="64" y="610" font-size="15" fill="#6B667E">Проект не аффилирован с oh-my-pi, Anthropic и провайдерами моделей.</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 668 1152 32">
    <text x="64" y="688" font-size="15" fill="#6B667E">Что это такое</text>
    <text x="1216" y="688" font-size="15" fill="#6B667E" text-anchor="end">02</text>
  </g>
</svg>
