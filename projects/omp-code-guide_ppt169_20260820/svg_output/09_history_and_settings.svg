<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Golos Text, Arial, Helvetica Neue, sans-serif">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="64 56 1152 100">
    <text x="64" y="76" font-size="15" font-weight="bold" letter-spacing="2" fill="#6F5CE8">СПРАВОЧНИК · УПРАВЛЕНИЕ</text>
    <text x="64" y="124" font-size="38" font-weight="bold" fill="#2A2440">История, меню шестерёнки и настройки</text>
    <line x1="64" y1="150" x2="1216" y2="150" stroke="#DDD8EE" stroke-width="1"/>
  </g>

  <g id="block-history" data-pptx-bounds="64 183 636 102">
    <text x="64" y="204" font-size="20" font-weight="bold" fill="#2A2440">История</text>
    <text x="64" y="232" font-size="15" fill="#1D1B26"><tspan x="64" dy="0">Все сессии по всем рабочим папкам, с фильтром по названию, превью,</tspan><tspan x="64" dy="22">папке и модели. Выбор переподключает агента и проигрывает транскрипт.</tspan><tspan x="64" dy="22">Export transcript as Markdown выгружает весь диалог в файл.</tspan></text>
  </g>

  <g id="block-gear" data-pptx-bounds="64 301 636 82">
    <text x="64" y="318" font-size="20" font-weight="bold" fill="#2A2440">Меню шестерёнки</text>
    <text x="64" y="346" font-size="15" fill="#1D1B26"><tspan x="64" dy="0">Новая вкладка, очистка сессии, экспорт, вход, ключи, перепроверка</tspan><tspan x="64" dy="22">моделей, диагностика, сжатие контекста, перезапуск агента.</tspan></text>
  </g>

  <g id="stage-management" data-pptx-bounds="744 172 472 268">
    <rect x="744" y="176" width="472" height="272" fill="#16141F"/>
    <image href="../images/history.png" x="838" y="200" width="130" height="204" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/settings-menu.png" x="992" y="200" width="130" height="204" preserveAspectRatio="xMidYMid meet"/>
