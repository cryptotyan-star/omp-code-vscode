    <text fill="#1D1B26" font-size="15" x="64" y="390">CLI не установлен или не в том PATH, который видит VS Code.</text><text fill="#1D1B26" font-size="15" x="64" y="412">Укажите полный путь в ompcode.ompPath.</text></g>

