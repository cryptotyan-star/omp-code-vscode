    <text fill="#6B667E" font-size="15" x="64" y="254">Отчёт показывает путь к бинарнику, вывод omp --version, проходит ли</text><text fill="#6B667E" font-size="15" x="64" y="276">хендшейк, у каких провайдеров есть учётные данные, какие модели</text><text fill="#6B667E" font-size="15" x="64" y="298">предлагает агент. Значений ключей в нём нет — можно приложить к issue.</text></g>

